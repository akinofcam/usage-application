<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="#6366F1" opacity="0.1"/>
  
  <!-- Main circle background -->
  <circle cx="128" cy="128" r="110" fill="#6366F1"/>
  
  <!-- Inner lighter circle for depth -->
  <circle cx="128" cy="128" r="100" fill="#818CF8"/>
  
  <!-- Chart/Graph representation -->
  <!-- Bar 1 (low) -->
  <g>
    <rect x="60" y="130" width="16" height="40" fill="#FFFFFF" opacity="0.9" rx="2"/>
    <text x="68" y="180" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">40%</text>
  </g>
  
  <!-- Bar 2 (medium) -->
  <g>
    <rect x="90" y="105" width="16" height="65" fill="#FBBF24" opacity="0.95" rx="2"/>
    <text x="98" y="180" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">65%</text>
  </g>
  
  <!-- Bar 3 (high) -->
  <g>
    <rect x="120" y="75" width="16" height="95" fill="#10B981" opacity="0.95" rx="2"/>
    <text x="128" y="180" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">95%</text>
  </g>
  
  <!-- Bar 4 (very high) -->
  <g>
    <rect x="150" y="55" width="16" height="115" fill="#EF4444" opacity="0.95" rx="2"/>
    <text x="158" y="180" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">110%</text>
  </g>
  
  <!-- Baseline -->
  <line x1="50" y1="170" x2="210" y2="170" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
  
  <!-- Title text -->
  <text x="128" y="218" font-size="18" font-weight="bold" fill="#6366F1" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">USAGE</text>
  
  <!-- Subtle accent lines -->
  <line x1="40" y1="128" x2="60" y2="128" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>
  <line x1="196" y1="128" x2="216" y2="128" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>
</svg>