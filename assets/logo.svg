<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#f0f0f5;stop-opacity:0.95" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Main background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGradient)"/>
  
  <!-- Subtle inner glow -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  
  <!-- Clock circle (main icon) -->
  <circle cx="256" cy="280" r="120" fill="url(#iconGradient)" stroke="rgba(102,126,234,0.3)" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- Clock inner border -->
  <circle cx="256" cy="280" r="115" fill="none" stroke="rgba(102,126,234,0.2)" stroke-width="2"/>
  
  <!-- Hour markers (simplified) -->
  <g stroke="rgba(102,126,234,0.5)" stroke-width="2.5" stroke-linecap="round">
    <!-- 12 o'clock -->
    <line x1="256" y1="170" x2="256" y2="180" />
    <!-- 3 o'clock -->
    <line x1="345" y1="280" x2="335" y2="280" />
    <!-- 6 o'clock -->
    <line x1="256" y1="390" x2="256" y2="380" />
    <!-- 9 o'clock -->
    <line x1="167" y1="280" x2="177" y2="280" />
  </g>
  
  <!-- Center dot -->
  <circle cx="256" cy="280" r="6" fill="rgba(102,126,234,0.8)"/>
  
  <!-- Hour hand (shorter) -->
  <line x1="256" y1="280" x2="256" y2="235" stroke="rgba(102,126,234,0.9)" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Minute hand (longer) -->
  <line x1="256" y1="280" x2="295" y2="280" stroke="rgba(118,75,162,0.85)" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Top stopwatch button -->
  <rect x="244" y="150" width="24" height="14" rx="3" fill="rgba(102,126,234,0.35)" stroke="rgba(102,126,234,0.6)" stroke-width="2"/>
  
  <!-- Bottom stopwatch button -->
  <rect x="244" y="405" width="24" height="14" rx="3" fill="rgba(102,126,234,0.2)" stroke="rgba(102,126,234,0.4)" stroke-width="2"/>
  
  <!-- "Usage" text at bottom -->
  <text x="256" y="465" font-family="Helvetica, Arial, sans-serif" font-size="42" font-weight="600" text-anchor="middle" fill="rgba(255,255,255,0.85)" letter-spacing="0.5">USAGE</text>
  
  <!-- Outer accent circle -->
  <circle cx="256" cy="280" r="128" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
</svg>
